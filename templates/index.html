<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do-list</title>
    <style >
        @import url("/static/main.css");
    </style>
</head>

<body>
    <div class="todo-container">
        <h1>待办清单</h1>
        <div class="input-box">
            <input type="text" id="todo-input" placeholder="请输入任务内容...">
            <button class="add-btn" onclick="addTodo()">添加</button>
            <button class="clear-btn" onclick="deleteAll()">清空所有任务</button>
        </div>
        <ul class="todo-list" id="todo-list"></ul>
    </div>
    <script src="/static/main.js"></script>
</body>

</html>
